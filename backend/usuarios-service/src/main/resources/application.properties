
spring.application.name=usuarios-service
server.port=8081

# Base de datos MariaDB / XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_usuarios
spring.datasource.username=pagoflex_usuarios_app
spring.datasource.password=${PAGOFLEX_USUARIOS_DB_PASSWORD}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
