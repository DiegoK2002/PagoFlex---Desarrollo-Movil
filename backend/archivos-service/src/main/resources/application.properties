spring.application.name=archivos-service
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_archivos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

pagoflex.archivos.directorio=almacenamiento

spring.cloud.openfeign.client.config.pagos-service.connectTimeout=3000
spring.cloud.openfeign.client.config.pagos-service.readTimeout=5000
