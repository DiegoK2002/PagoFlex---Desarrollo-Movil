spring.application.name=api-gateway


spring.cloud.gateway.server.webflux.routes[0].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/usuarios/**


spring.cloud.gateway.server.webflux.routes[1].id=empresas-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://empresas-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/empresas/**
