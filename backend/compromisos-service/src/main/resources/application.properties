spring.application.name=compromisos-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_compromisos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.cloud.openfeign.client.config.empresas-service.connectTimeout=3000
spring.cloud.openfeign.client.config.empresas-service.readTimeout=5000

spring.cloud.openfeign.client.config.usuarios-service.connectTimeout=3000
spring.cloud.openfeign.client.config.usuarios-service.readTimeout=5000
